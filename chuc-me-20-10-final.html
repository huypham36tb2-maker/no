<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&family=Itim&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#4A2418;--ttl:#D4432B;--paper:#FFF8E7;--b1:#FFF8E7;--b2:#A9CB6B;--b3:#F6A9BD;--b4:#FBE9A0;--b5:#FFF8E7;
  --ta:#FCEFB4;--tb:#F5CF45;--shadow:rgba(74,36,24,.35);--beat:0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#FFF1E0;--ttl:#FF8A70;--paper:#2B1B17;--b1:#2B1B17;--b2:#33401E;--b3:#4D2133;--b4:#4A3A14;--b5:#2B1B17;--ta:#5A4B1E;--tb:#8A7228;--shadow:rgba(0,0,0,.6)}
}
:root[data-theme="dark"]{--ink:#FFF1E0;--ttl:#FF8A70;--paper:#2B1B17;--b1:#2B1B17;--b2:#33401E;--b3:#4D2133;--b4:#4A3A14;--b5:#2B1B17;--ta:#5A4B1E;--tb:#8A7228;--shadow:rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;position:relative;color:var(--ink);background:var(--cv,var(--b1));font-family:Itim,"Segoe UI",system-ui,sans-serif}
button{font:inherit}
button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ttl);outline-offset:3px}
#st{position:absolute;inset:0}
#gate{position:absolute;inset:0;z-index:100;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1.5rem;text-align:center;background:var(--b1)}
#gate>:first-child{margin-top:auto}#gate>:last-child{margin-bottom:auto}
#gate[hidden]{display:none}
.ttl{font-family:"Playfair Display",Georgia,serif;font-weight:900;color:var(--ttl);font-size:clamp(2rem,10vw,3rem);line-height:1.12;margin:0}
.big{font-size:5rem;line-height:1;border:0;background:none;cursor:pointer;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
#gate p{margin:0;color:var(--ink)}
details{width:100%;max-width:20rem;text-align:left;font-size:.95rem}
summary{cursor:pointer;width:max-content}
.fields{display:grid;gap:.7rem;margin-top:.7rem}
label{display:grid;gap:.25rem}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:8px;padding:.55rem .7rem}

.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3.4rem 1.2rem 4.8rem;overflow:hidden;text-align:center;background:var(--bg);animation:enter .95s cubic-bezier(.77,0,.18,1) both;cursor:pointer;will-change:transform}
.sc[hidden]{display:none}
.s1{--bg:var(--b1)}.s2{--bg:var(--b2)}.s3{--bg:var(--b3)}.s4{--bg:var(--b4)}.s5{--bg:var(--b5)}
@keyframes enter{0%{transform:translateY(100%) scale(.96);opacity:.3;filter:blur(8px)}65%{transform:translateY(-1.5%) scale(1.005);opacity:1;filter:blur(0)}100%{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}}
.in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1rem;width:100%;max-width:22rem}
.ln{display:block;overflow:hidden;padding:.2em 0 .1em;margin:-.1em 0}
.ln>span{display:block;animation:up 1s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(.75s + var(--l)*.14s)}
@keyframes up{0%{transform:translateY(125%);opacity:0;filter:blur(5px)}75%{transform:translateY(-5%);opacity:1;filter:blur(0)}100%{transform:translateY(0);opacity:1;filter:blur(0)}}
.tag{font:900 1.4rem "Playfair Display",Georgia,serif;padding:.05rem .95rem;border-radius:999px;background:var(--ttl);color:var(--paper);rotate:-4deg;animation:pop .8s cubic-bezier(.3,1.6,.5,1) .5s both}
.pic,.sm{border:.45rem solid #fff;border-radius:6px;box-shadow:0 12px 24px -12px var(--shadow);
  background:radial-gradient(120% 75% at 25% 118%,#7DB23A 58%,transparent 59%),linear-gradient(#A9DAF5,#E4F4FC)}
.pic{width:min(64vw,16rem);aspect-ratio:4/3;rotate:-3deg;animation:pop .9s cubic-bezier(.2,1.3,.4,1) .8s both,flo 5s ease-in-out 1.8s infinite alternate}
@keyframes flo{0%,100%{translate:0 -5px;rotate:-3deg}50%{translate:0 6px;rotate:1deg}}
.sm{position:absolute;right:5%;top:3.8rem;width:min(27vw,7rem);aspect-ratio:3/4;rotate:7deg;z-index:2;animation:pop .9s cubic-bezier(.3,1.4,.5,1) 1.1s both}
@keyframes pop{from{opacity:0;transform:translateY(46px) rotate(-14deg) scale(.5)}to{opacity:1;transform:none}}
.txt{margin:0;max-width:20rem;font-size:clamp(1.2rem,5.2vw,1.55rem);line-height:1.5}
.w{display:inline-block;opacity:0;animation:wd .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*.26s + 1.5s)}
@keyframes wd{from{opacity:0;translate:0 .5em}to{opacity:1;translate:0 0}}
.stk{position:absolute;z-index:0;font-style:normal;font-size:clamp(2rem,9vw,2.8rem);will-change:transform;
  animation:pop .8s cubic-bezier(.3,1.6,.5,1) var(--dl,.6s) both,wig 3.2s ease-in-out infinite alternate}
@keyframes wig{from{rotate:-9deg}to{rotate:9deg}}
.k0{left:5%;bottom:11%;--dl:.8s}.k1{right:6%;bottom:13%;--dl:1s}.k2{left:6%;top:22%;--dl:1.2s}.k3{right:7%;top:46%;--dl:1.4s}
.tape{position:absolute;top:3.4rem;left:-1.2rem;width:8rem;height:1.8rem;rotate:-12deg;background-color:var(--ta);
  background-image:linear-gradient(90deg,var(--tb) 50%,transparent 50%),linear-gradient(var(--tb) 50%,transparent 50%);background-size:18px 18px}
.dd{position:absolute;left:8%;bottom:21%;width:7rem;overflow:visible}
.dd path{fill:none;stroke:var(--ttl);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s ease 1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sign{margin:0;font-size:1.5rem;color:var(--ttl)}
.sign,.btns{opacity:0;animation:fadein 1.6s ease 3.6s forwards}
@keyframes fadein{to{opacity:1}}
.btns{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.pill{border:0;border-radius:999px;padding:.7rem 1.2rem;font-size:1.05rem;cursor:pointer;background:var(--ttl);color:var(--paper)}
.pill.o{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.bl{position:absolute;z-index:0;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--paper) 70%,transparent),transparent 65%);animation:drift 16s ease-in-out infinite alternate;will-change:transform}
.bl.a{left:-35vmax;top:-30vmax}.bl.b{right:-40vmax;bottom:-35vmax;animation-duration:20s;animation-direction:alternate-reverse}
@keyframes drift{0%{transform:translate(0,0) scale(.94)}50%{transform:translate(4vmax,3vmax) scale(1.08)}100%{transform:translate(9vmax,6vmax) scale(1.16)}}
.sp{position:absolute;z-index:0;color:var(--ttl);font-style:normal;font-size:1rem;opacity:0;animation:twk 2.6s ease-in-out var(--dl,1s) infinite}
@keyframes twk{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.9;transform:scale(1.1) rotate(45deg)}}
.sc.out{animation:leave .95s cubic-bezier(.77,0,.18,1) both}
@keyframes leave{0%{transform:scale(1);opacity:1;filter:blur(0)}100%{transform:scale(.92) translateY(-7%);opacity:0;filter:blur(6px)}}
#bars{position:fixed;left:1rem;right:1rem;top:calc(.8rem + env(safe-area-inset-top,0px));display:flex;gap:4px;z-index:70}
#bars i{flex:1;height:3px;border-radius:2px;background:var(--shadow);overflow:hidden}
#bars i::after{content:"";display:block;height:100%;background:var(--ttl);transform:scaleX(0);transform-origin:left}
#bars i.done::after{transform:scaleX(1)}
#bars i.cur::after{animation:fill var(--d,8s) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.petal,.bit{position:fixed;top:0;pointer-events:none}
.petal{z-index:60;opacity:.8}.bit{z-index:65;font-size:1.4rem}
.mus{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:80;width:46px;height:46px;border-radius:50%;
  border:2px solid var(--ttl);background:var(--paper);color:var(--ttl);font-size:1.3rem;cursor:pointer;
  box-shadow:0 6px 14px -6px var(--shadow)}
.mus[aria-pressed="true"]{background:var(--ttl);color:var(--paper)}
/* Motion polish: elegant depth, gentle glow, and responsive-friendly effects */
.ttl{text-shadow:0 5px 22px color-mix(in srgb,var(--ttl) 18%,transparent);letter-spacing:.015em}
.pic,.sm{transition:box-shadow .5s ease;box-shadow:0 18px 35px -16px var(--shadow),0 0 0 1px #ffffff70}
.tag{box-shadow:0 8px 18px color-mix(in srgb,var(--ttl) 28%,transparent)}
.pill{transition:transform .25s ease,box-shadow .25s ease}
.pill:active{transform:scale(.96)}
.sc::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,#ffffff24,transparent 40%,#ffffff0d);z-index:0}
.stk{filter:drop-shadow(0 5px 8px #00000012)}
@media (max-width:420px){.sc{padding-inline:1rem}.in{gap:.85rem}.txt{line-height:1.42}.stk{font-size:2rem}}
@media (prefers-reduced-motion:reduce){
  .sc,.sc.out,.ln>span,.bl,.sp,.ttl,.tag,.pic,.sm,.stk,.big,.w,.sign,.btns{animation:none!important;opacity:1}
  .dd path{animation:none;stroke-dashoffset:0}
}
</style>
</head>
<body>
<div id="bars" aria-hidden="true"></div>
<div id="st"></div>
<section id="gate">
  <h1 class="ttl">Có một lá thư<br>gửi mẹ</h1>
  <button class="big" id="go" type="button" aria-label="Mở thư gửi mẹ">💌</button>
  <p>Chạm vào phong thư để bắt đầu</p>

</section>

<script>
(function(){
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function $(s){return document.querySelector(s)}
  var st=$("#st"),gate=$("#gate"),bars=$("#bars"),root=document.documentElement;
  var pics=[],scs=[],cur=-1,tm,z=5,lastGo=0,bt=[],pt;
  var S=[
    {c:"s1",t:"CHÚC MỪNG<br>NGÀY 20/10",x:"{M} mãi là người phụ nữ tuyệt vời nhất trong lòng con!",k:["🧸","🌈","🌷","✨"],d:15000},
    {c:"s2",g:"#1",x:"Cảm ơn {m} vì đã luôn hi sinh, yêu thương và chăm lo cho gia đình.",k:["🍄","🌼","✨","🌿"],d:8500},
    {c:"s3",g:"#2",x:"Chúc {m} luôn mạnh khỏe, nụ cười luôn nở trên môi.",k:["🍋","☁️","⭐","🌸"],d:8000},
    {c:"s4",g:"#3",x:"{M} là món quà quý nhất mà con có. Chúc {m} 20/10 thật nhiều hoa và niềm vui!",k:["🌷","💛","⭐","🌷"],d:9500},
    {c:"s5",t:"{M} ơi,<br>CON YÊU {U}<br>NHIỀU LẮM!",k:["💛","💗","💛","⚡"],f:1}
  ];
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
  function names(){
    return {m:"mẹ",M:"Mẹ",U:"MẸ",c:"Con"};
  }
  function fmt(s,n){return s.replace(/\{m\}/g,n.m).replace(/\{M\}/g,n.M).replace(/\{U\}/g,n.U)}
  function words(s){return s.split(" ").map(function(w,i){return "<span class=\"w\" style=\"--k:"+i+"\">"+w+"</span>"}).join(" ")}
  function center(el){var r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}

  function burst(x,y,n){
    if(reduce||!document.body.animate)return;
    var c=["🌸","💗","🌷","💖","✨"];
    for(var i=0;i<n;i++){
      var s=document.createElement("span");s.className="bit";s.textContent=c[i%c.length];
      s.style.left=x+"px";s.style.top=y+"px";document.body.appendChild(s);
      var a=Math.random()*Math.PI*2,d=80+Math.random()*130,dx=Math.cos(a)*d,dy=Math.sin(a)*d-70;
      s.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:1},
        {transform:"translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px)) scale(1.2)",opacity:0}],
        {duration:1100+Math.random()*700,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=(function(el){return function(){el.remove()}})(s);
    }
  }
  function petal(){
    if(reduce||!document.body.animate||document.hidden)return;
    var fin=cur>=0&&S[cur].f,s=document.createElement("span");s.className="petal";
    s.textContent=fin?(Math.random()<.5?"💛":"💗"):(Math.random()<.6?"🌸":"✨");
    s.style.left=Math.random()*100+"vw";s.style.fontSize=(.9+Math.random()*.9)+"rem";document.body.appendChild(s);
    var dx=Math.random()*160-80,rot=Math.random()*540-270,p=fin?"110vh":"-10vh",q=fin?"-12vh":"110vh";
    s.animate([{transform:"translate(0,"+p+") rotate(0deg)",opacity:0},{opacity:.9,offset:.1},
      {transform:"translate("+dx+"px,"+q+") rotate("+rot+"deg)",opacity:.8}],
      {duration:7000+Math.random()*5000,easing:"linear"}).onfinish=function(){s.remove()};
  }
  function startPetals(){if(!pt){petal();pt=setInterval(petal,1100)}}

  function applyPics(){
    if(!pics.length)return;
    document.querySelectorAll(".pic,.sm").forEach(function(e,i){e.style.background="center/cover url("+pics[i%pics.length]+")"});
  }
  function mk(s,i){
    var n=names(),e=document.createElement("section");e.className="sc "+s.c;e.hidden=true;
    var h="<i class=\"bl a\"></i><i class=\"bl b\"></i><span class=\"tape\"></span><svg class=\"dd\" viewBox=\"0 0 120 30\" aria-hidden=\"true\"><path pathLength=\"1\" d=\"M4 18 q9-22 18 0 t18 0 t18 0 t18 0 t18 0 t18 0\"/></svg>";
    s.k.forEach(function(k,j){h+="<i class=\"stk k"+j+"\" aria-hidden=\"true\">"+k+"</i>"});
    [[12,34],[84,30],[20,64],[76,72],[50,12]].forEach(function(p,q){h+="<i class=\"sp\" aria-hidden=\"true\" style=\"left:"+p[0]+"%;top:"+p[1]+"%;--dl:"+(1+q*.45)+"s\">✦</i>"});
    h+="<div class=\"in\">";
    if(s.t)h+="<h2 class=\"ttl\">"+fmt(s.t,n).split("<br>").map(function(l,q){return "<span class=\"ln\"><span style=\"--l:"+q+"\">"+l+"</span></span>"}).join("")+"</h2>";
    if(s.g)h+="<b class=\"tag\">"+s.g+"</b>";
    h+="<div class=\"pic\"></div>";
    var x=s.x||"Cảm ơn {m} vì tất cả.";
    h+="<p class=\"txt\">"+words(fmt(x,n))+"</p>";
    if(s.f)h+="<p class=\"sign\">— "+n.c+"</p><div class=\"btns\"><button class=\"pill hug\" type=\"button\">Gửi mẹ một cái ôm</button><button class=\"pill o rep\" type=\"button\">Xem lại</button></div>";
    h+="</div>";
    if(i>0&&!s.f)h+="<div class=\"sm\"></div>";
    e.innerHTML=h;
    e.addEventListener("click",function(ev){if(ev.target.closest("button"))return;next()});
    if(s.f){
      e.querySelector(".hug").addEventListener("click",function(ev){var p=center(ev.currentTarget);burst(p[0],p[1],22);ev.currentTarget.textContent="Mẹ ôm con lại rồi 🤍"});
      e.querySelector(".rep").addEventListener("click",replay);
    }
    return e;
  }
  function go(n){
    clearTimeout(tm);
    var prev=cur,el=scs[n],s=S[n];
    cur=n;lastGo=Date.now();el.classList.remove("out");el.style.zIndex=++z;el.hidden=false;
    bt=[].slice.call(el.querySelectorAll(".stk,.ttl,.pic")).map(function(e){e._f=e.classList.contains("stk")?.28:.04;return e});
    root.style.setProperty("--cv","var(--b"+(n+1)+")");
    if(prev>=0&&prev!==n){var pe=scs[prev];pe.classList.add("out");setTimeout(function(){if(cur!==prev){pe.hidden=true;pe.classList.remove("out")}},reduce?0:1000)}
    var b=bars.children;
    for(var j=0;j<b.length;j++){
      b[j].className=(j<n||(j===n&&s.f))?"done":(j===n?"cur":"");
      if(j===n&&!s.f)b[j].style.setProperty("--d",(s.d/1000)+"s");
    }
    if(!s.f)tm=setTimeout(function(){go(n+1)},s.d);
  }
  function next(){if(cur>=0&&cur<S.length-1&&Date.now()-lastGo>1000)go(cur+1)}
  function replay(){
    go(0);
  }
  function begin(){
    if(cur>=0)return;
    st.innerHTML="";scs=S.map(mk);scs.forEach(function(e){st.appendChild(e)});
    bars.innerHTML=S.map(function(){return "<i></i>"}).join("");
    applyPics();gate.hidden=true;startPetals();go(0);
  }
  $("#go").addEventListener("click",begin);

})();
</script>
</body>
</html>
